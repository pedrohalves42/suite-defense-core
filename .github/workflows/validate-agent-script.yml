name: Validate Agent Script

on:
  push:
    paths:
      - 'public/agent-scripts/cybershield-agent-windows-v3.ps1'
      - 'supabase/functions/_shared/agent-script-windows-content.ts'
      - 'scripts/verificar-installer-agente.ps1'
  pull_request:
    paths:
      - 'public/agent-scripts/cybershield-agent-windows-v3.ps1'
      - 'supabase/functions/_shared/agent-script-windows-content.ts'
      - 'scripts/verificar-installer-agente.ps1'
  workflow_dispatch:

jobs:
  validate-script:
    name: Validate Windows Agent Script
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate encoding and syntax
        shell: pwsh
        run: |
          Write-Host "=== Validating Agent Script ===" -ForegroundColor Cyan
          
          $scriptPath = "public/agent-scripts/cybershield-agent-windows-v3.ps1"
          
          if (-not (Test-Path $scriptPath)) {
            Write-Host "[ERROR] Script not found: $scriptPath" -ForegroundColor Red
            exit 1
          }
          
          # Run validation script
          & "scripts/verificar-installer-agente.ps1" -ScriptPath $scriptPath
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "[FAILURE] Agent script validation FAILED!" -ForegroundColor Red
            Write-Host "Please fix the issues above before merging." -ForegroundColor Red
            exit 1
          }
          
          Write-Host ""
          Write-Host "[SUCCESS] Agent script validation PASSED!" -ForegroundColor Green

      - name: Check for Unicode characters
        shell: pwsh
        run: |
          Write-Host "=== Checking for Unicode/Emoji Characters ===" -ForegroundColor Cyan
          
          $scriptPath = "public/agent-scripts/cybershield-agent-windows-v3.ps1"
          $content = Get-Content $scriptPath -Raw -Encoding UTF8
          
          $nonAscii = $content.ToCharArray() | Where-Object { [int][char]$_ -gt 127 }
          
          if ($nonAscii.Count -gt 0) {
            Write-Host "[ERROR] Found $($nonAscii.Count) non-ASCII characters!" -ForegroundColor Red
            Write-Host "This will cause parsing errors in PowerShell 5.1" -ForegroundColor Red
            
            $unique = $nonAscii | Select-Object -Unique | Select-Object -First 10
            Write-Host "Examples (first 10 unique):" -ForegroundColor Yellow
            foreach ($ch in $unique) {
              $code = [int][char]$ch
              Write-Host "  '$ch' (U+$($code.ToString('X4')))" -ForegroundColor Yellow
            }
            exit 1
          }
          
          Write-Host "[OK] No non-ASCII characters found - script is ASCII-safe" -ForegroundColor Green

      - name: Validate embedded script matches source
        shell: pwsh
        run: |
          Write-Host "=== Validating Script Synchronization ===" -ForegroundColor Cyan
          
          $sourcePath = "public/agent-scripts/cybershield-agent-windows-v3.ps1"
          $embeddedPath = "supabase/functions/_shared/agent-script-windows-content.ts"
          
          if (-not (Test-Path $embeddedPath)) {
            Write-Host "[WARN] Embedded script not found - may need sync" -ForegroundColor Yellow
            exit 0
          }
          
          $sourceContent = Get-Content $sourcePath -Raw
          $embeddedContent = Get-Content $embeddedPath -Raw
          
          # Check if source content appears in embedded file
          $sourceLines = ($sourceContent -split "`r?`n").Count
          $embeddedHasContent = $embeddedContent -match [regex]::Escape($sourceContent.Substring(0, [Math]::Min(500, $sourceContent.Length)))
          
          if (-not $embeddedHasContent) {
            Write-Host "[WARN] Source and embedded scripts may be out of sync" -ForegroundColor Yellow
            Write-Host "Run 'npm run sync:agent' to synchronize" -ForegroundColor Yellow
          } else {
            Write-Host "[OK] Source script appears to be embedded correctly" -ForegroundColor Green
          }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== Validation Complete ===" -ForegroundColor Cyan
          Write-Host ""
          if ($env:VALIDATION_FAILED -eq "true") {
            Write-Host "Status: FAILED" -ForegroundColor Red
            exit 1
          } else {
            Write-Host "Status: PASSED" -ForegroundColor Green
          }

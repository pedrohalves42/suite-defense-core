name: Bloco C Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  bloco-c-gates:
    name: Bloco C anti-regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gates
        run: |
          chmod +x scripts/bloco-c-gates.sh
          ./scripts/bloco-c-gates.sh

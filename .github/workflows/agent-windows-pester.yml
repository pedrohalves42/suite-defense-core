name: agent-windows-pester

on:
  push:
    paths:
      - 'agents/windows/**'
      - '.github/workflows/agent-windows-pester.yml'
  pull_request:
    paths:
      - 'agents/windows/**'

jobs:
  pester:
    name: Pester + PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester              -RequiredVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer    -RequiredVersion 1.21.0 -Force -SkipPublisherCheck

      - name: Bootstrap lockfile — verify pinned tool/module versions (Phase 6.6)
        shell: pwsh
        run: pwsh -NoProfile -File agents/windows/bootstrap.ps1 -Verify


      - name: PSScriptAnalyzer — hexagonal layers (strict / Error)
        shell: pwsh
        run: |
          $paths = @(
            'agents/windows/ports',
            'agents/windows/domain',
            'agents/windows/application',
            'agents/windows/adapters'
          )
          $r = Invoke-ScriptAnalyzer -Path $paths -Recurse `
                  -Settings agents/windows/PSScriptAnalyzerSettings.Hex.psd1
          if ($r) {
            $r | Format-Table -AutoSize
            $errs = $r | Where-Object Severity -eq 'Error'
            if ($errs) { Write-Error "Hex layer Errors: $($errs.Count)"; exit 1 }
          }

      - name: PSScriptAnalyzer — composition (hex strict, excludes CompatShims)
        shell: pwsh
        run: |
          $files = Get-ChildItem agents/windows/composition -Filter *.ps1 |
                    Where-Object { $_.Name -ne 'CompatShims.ps1' }
          $r = Invoke-ScriptAnalyzer -Path $files.FullName `
                  -Settings agents/windows/PSScriptAnalyzerSettings.Hex.psd1
          if ($r) {
            $r | Format-Table -AutoSize
            $errs = $r | Where-Object Severity -eq 'Error'
            if ($errs) { Write-Error "Composition Errors: $($errs.Count)"; exit 1 }
          }

      - name: PSScriptAnalyzer — legacy modules (Warning, baseline only)
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path agents/windows/modules -Recurse `
                  -Settings agents/windows/PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table -AutoSize }
          # non-blocking — captured for trend analysis only
          exit 0

      - name: Pester — full suite
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'agents/windows/tests'
          $cfg.Run.Exit = $true
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'pester-results.xml'
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-results
          path: pester-results.xml

      - name: No-new-globals gate
        shell: pwsh
        run: |
          # Strip ALL PowerShell comments (line + block <#...#>) via the
          # tokenizer, then count $Global:* references on the remaining code.
          # Avoids false positives from doctrings that legitimately mention
          # `$Global:*` in prose (e.g. ADR notes inside <# ... #> blocks).
          function Get-CodeOnly([string]$Path) {
              $src = Get-Content -Raw -LiteralPath $Path
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseInput(
                  $src, [ref]$tokens, [ref]$errors)
              ($tokens | Where-Object { $_.Kind -ne 'Comment' } |
                  ForEach-Object { $_.Text }) -join ' '
          }
          function Count-Globals([string]$Path) {
              ([regex]::Matches((Get-CodeOnly $Path), '\$Global:')).Count
          }

          $files = @()
          $files += Get-ChildItem agents/windows/ports       -Recurse -Filter *.ps1
          $files += Get-ChildItem agents/windows/domain      -Recurse -Filter *.ps1
          $files += Get-ChildItem agents/windows/adapters    -Recurse -Filter *.ps1
          $files += Get-ChildItem agents/windows/application -Recurse -Filter *.ps1
          $files += Get-ChildItem agents/windows/composition -Recurse -Filter *.ps1 |
                      Where-Object { $_.Name -ne 'CompatShims.ps1' }
          $offenders = @()
          foreach ($f in $files) {
              $n = Count-Globals $f.FullName
              if ($n -gt 0) { $offenders += [pscustomobject]@{ File=$f.FullName; Count=$n } }
          }
          if ($offenders) {
              $offenders | Format-Table -AutoSize
              Write-Error "Hex layers must not introduce `$Global:* references (CompatShims.ps1 is the only allowed bridge)."
              exit 1
          }
          Write-Host "Hex layers: 0 `$Global:* references (comment-stripped scan)"

      - name: Legacy modules — monotonic-decrease baseline gate (ADR-003 / Phase 6)
        shell: pwsh
        run: |
          function Get-CodeOnly([string]$Path) {
              $src = Get-Content -Raw -LiteralPath $Path
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseInput(
                  $src, [ref]$tokens, [ref]$errors)
              ($tokens | Where-Object { $_.Kind -ne 'Comment' } |
                  ForEach-Object { $_.Text }) -join ' '
          }
          function Count-Globals([string]$Path) {
              ([regex]::Matches((Get-CodeOnly $Path), '\$Global:')).Count
          }

          $baselinePath = 'agents/windows/tests/baseline-globals.json'
          if (-not (Test-Path $baselinePath)) {
              Write-Error "Baseline file missing: $baselinePath"
              exit 1
          }
          $baseline = (Get-Content $baselinePath -Raw | ConvertFrom-Json).per_module
          $baselineMap = @{}
          $baseline.PSObject.Properties | ForEach-Object { $baselineMap[$_.Name] = [int]$_.Value }

          $regressions = @()
          $improvements = @()
          Get-ChildItem agents/windows/modules -Recurse -Filter *.ps1 | ForEach-Object {
              $count = Count-Globals $_.FullName
              $base  = if ($baselineMap.ContainsKey($_.Name)) { $baselineMap[$_.Name] } else { 0 }
              if ($count -gt $base) {
                  $regressions  += [pscustomobject]@{ Module=$_.Name; Baseline=$base; Current=$count; Delta=($count - $base) }
              } elseif ($count -lt $base) {
                  $improvements += [pscustomobject]@{ Module=$_.Name; Baseline=$base; Current=$count; Delta=($count - $base) }
              }
          }

          if ($improvements) {
              Write-Host "Improvements (refresh baseline-globals.json in the same PR):"
              $improvements | Format-Table -AutoSize
          }
          if ($regressions) {
              Write-Host "REGRESSIONS — new `$Global:* introduced in legacy modules:"
              $regressions | Format-Table -AutoSize
              Write-Error "ADR-003 monotonic-decrease gate violated. Either remove the new globals or justify in an ADR amendment."
              exit 1
          }
          Write-Host "Legacy modules: no `$Global:* regressions vs Phase 6 baseline."



name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Lint and frontend type check (non-blocking for Edge Functions)
  lint:
    name: Lint & Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run ESLint
        run: bun run lint
      
      - name: Run Frontend TypeScript check
        run: bunx tsc --noEmit

  # Dedicated Edge Function Check (Optional/Non-blocking if it fails on debt)
  edge-type-check:
    name: Edge Function Type Check (Strict)
    runs-on: ubuntu-latest
    continue-on-error: true # Permite deploy mesmo com débitos técnicos de tipos
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      
      - name: Check all functions
        run: |
          deno check supabase/functions/**/*.ts || echo "⚠️ Alerta: Débitos técnicos de tipos detectados."

  # Build Check (Viability) - This one SHOULD fail on real build errors
  build-viability:
    name: Edge Function Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          
      - name: Runtime-compatible bundling check
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking bundling for $f..."
            deno check --no-check $f || exit 1
          done

  # ASCII Guard Check
  ascii-guard:
    name: ASCII Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ASCII Guard
        run: bun run ascii:check

  # Unit Tests (Frontend)
  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test -- --coverage

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: bunx playwright test --config=config/playwright.config.ts --project=chromium

  # Application Build
  app-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build

  # Edge Function Integration Tests (Deno)
  edge-function-tests:
    name: Edge Function Tests
    runs-on: ubuntu-latest
    needs: [build-viability]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Setup Bun (for parser)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run Optimized Edge Tests
        run: |
          chmod +x scripts/debug-tests.sh
          ./scripts/debug-tests.sh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run npm audit
        run: bunx npm audit --audit-level=high || true

  # Edge Function Governance
  edge-function-gates:
    name: Edge Function Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CI quality gate
        run: python3 scripts/ci_quality_gate.py --check-zod --root supabase/functions

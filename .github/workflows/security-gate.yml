name: Security Health Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  security-gate:
    name: 🔒 Security Invariants Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make security gate script executable
        run: chmod +x ./ci/security_gate.sh

      - name: Run Security Gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "## ⚠️ Security Gate SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "DATABASE_URL secret not configured. Security invariants were NOT validated." >> $GITHUB_STEP_SUMMARY
            echo "::warning::Security gate SKIPPED — DATABASE_URL not configured. Invariants NOT validated."
            exit 1
          fi
          ./ci/security_gate.sh

      - name: Generate Security Report
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not set - cannot generate report"
            exit 0
          fi
          
          echo "## 🔒 Security Invariants Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get invariants status
          psql "$DATABASE_URL" -t -c "
            SELECT '| ' || invariant || ' | ' || violations || ' | ' || status || ' |'
            FROM v_security_invariants
            ORDER BY 
              CASE status WHEN 'CRITICAL' THEN 1 WHEN 'HIGH' THEN 2 WHEN 'LOW' THEN 3 ELSE 4 END,
              invariant;
          " 2>/dev/null | while read -r line; do
            if [ -n "$line" ]; then
              echo "$line" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Invariant | Violations | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|--------|" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: security-gate
    if: failure()
    
    steps:
      - name: Create Failure Summary
        run: |
          echo "## ❌ Security Gate Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Critical security issues were detected." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**This deployment is blocked until all CRITICAL issues are resolved.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 Reference: [Security Invariants](docs/SECURITY_INVARIANTS.md)" >> $GITHUB_STEP_SUMMARY

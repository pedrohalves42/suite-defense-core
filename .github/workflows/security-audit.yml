name: Security Audit

on:
  schedule:
    - cron: '0 2 * * 1' # Segunda-feira às 2h UTC
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run npm audit (production)
      run: |
        bunx npm audit --production --audit-level=high 2>&1 | tee npm-audit-prod.txt || true
      continue-on-error: true

    - name: Run npm audit (all dependencies)
      run: |
        bunx npm audit --audit-level=critical 2>&1 | tee npm-audit-all.txt || true
      continue-on-error: true

    - name: Check for outdated dependencies
      run: |
        bunx npm outdated 2>&1 | tee npm-outdated.txt || true
      continue-on-error: true

    - name: Upload npm audit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: npm-audit-report
        path: |
          npm-audit-prod.txt
          npm-audit-all.txt
          npm-outdated.txt
        retention-days: 30

  deno-lint:
    name: Deno Edge Functions Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Lint Edge Functions
      run: |
        find supabase/functions -name "*.ts" -not -path "*/__tests__/*" -not -path "*/_shared/*" -not -name "*.test.ts" -type f | head -50 | while read file; do
          echo "Linting: $file"
          deno lint "$file" 2>&1 || echo "Lint issues in $file"
        done | tee deno-lint-report.txt
      continue-on-error: true

    - name: Upload Deno lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deno-lint-report
        path: |
          deno-lint-report.txt
        retention-days: 30

  typescript-security:
    name: TypeScript Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run TypeScript compiler check
      run: |
        bunx tsc --noEmit 2>&1 | tee typescript-errors.txt || true
      continue-on-error: true

    - name: Check for sensitive patterns
      run: |
        echo "=== Checking for hardcoded secrets ===" > security-patterns.txt
        grep -rn "password\s*=" --include="*.ts" --include="*.tsx" src/ || echo "No hardcoded passwords found" >> security-patterns.txt
        grep -rn "api_key\s*=" --include="*.ts" --include="*.tsx" src/ || echo "No hardcoded API keys found" >> security-patterns.txt
        grep -rn "secret\s*=" --include="*.ts" --include="*.tsx" src/ || echo "No hardcoded secrets found" >> security-patterns.txt
        
        echo "=== Checking for dangerous patterns ===" >> security-patterns.txt
        grep -rn "dangerouslySetInnerHTML" --include="*.tsx" src/ || echo "No dangerouslySetInnerHTML found" >> security-patterns.txt
        grep -rn "eval(" --include="*.ts" --include="*.tsx" src/ || echo "No eval() found" >> security-patterns.txt
        grep -rn "innerHTML\s*=" --include="*.ts" --include="*.tsx" src/ || echo "No innerHTML assignments found" >> security-patterns.txt
        
        cat security-patterns.txt
      continue-on-error: true

    - name: Upload security analysis results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: typescript-security-report
        path: |
          typescript-errors.txt
          security-patterns.txt
        retention-days: 30

  e2e-security-tests:
    name: E2E Security Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install Playwright browsers
      run: bunx playwright install --with-deps chromium

    - name: Run security E2E tests
      run: bunx playwright test e2e/rls-automated-tests.spec.ts e2e/rls-cross-tenant-isolation.spec.ts e2e/security-invariants.spec.ts --reporter=html
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      continue-on-error: true

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-security-report
        path: playwright-report/
        retention-days: 30

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, deno-lint, typescript-security]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: reports/
      continue-on-error: true

    - name: Generate summary
      run: |
        echo "# 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deno Lint | ${{ needs.deno-lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| TypeScript Security | ${{ needs.typescript-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Run at: $(date -u)" >> $GITHUB_STEP_SUMMARY

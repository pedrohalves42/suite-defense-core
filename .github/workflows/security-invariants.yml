name: Security Invariants Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  contract-tests:
    name: 📋 Contract Tests (Edge ↔ DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install contract dependencies
        run: |
          cd contracts
          bun install --frozen-lockfile

      - name: Install Playwright
        run: |
          cd contracts
          bunx playwright install --with-deps chromium

      - name: Run Contract Tests
        id: contract-tests
        run: |
          cd contracts
          bunx playwright test --reporter=json --output-file=contract-results.json
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        continue-on-error: false

      - name: Upload Contract Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results-${{ github.sha }}
          path: contracts/contract-results.json
          retention-days: 30

  security-invariants:
    name: 🔒 Security Invariants Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run Security Invariants Tests
        id: security-tests
        run: bunx playwright test e2e/security-invariants.spec.ts --reporter=json --output-file=security-results.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        continue-on-error: false

      - name: Generate Evidence Artifact
        if: always()
        run: |
          bunx tsx scripts/generate-security-evidence.ts || echo "Evidence generation skipped"
        env:
          COMMIT_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-invariants-evidence-${{ github.sha }}
          path: |
            artifacts/security/*.json
            artifacts/security/*.sha256
          retention-days: 90

      - name: Fail on Security Violation
        if: failure()
        run: |
          echo "🚨 CRITICAL: SECURITY INVARIANT VIOLATION DETECTED"
          echo ""
          echo "One or more security invariants have been violated."
          echo "This merge is BLOCKED until all violations are resolved."
          echo ""
          echo "Reference: docs/SECURITY_INVARIANTS.md"
          echo ""
          exit 1

  summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [contract-tests, security-invariants]
    if: always()

    steps:
      - name: Security Gate Summary
        run: |
          echo "## Security Invariants Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Contract Tests Status
          if [ "${{ needs.contract-tests.result }}" == "success" ]; then
            echo "### ✅ Contract Tests PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Contract Tests FAILED" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Schema drift or forbidden column detected!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Security Invariants Status
          if [ "${{ needs.security-invariants.result }}" == "success" ]; then
            echo "### ✅ Security Invariants PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Invariant | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| INV-001: Cross-Tenant Isolation | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| INV-002: HMAC Authentication | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| INV-003: Script Integrity | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| INV-004: AI Data Isolation | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| INV-005: Fail-Closed Behavior | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
            echo "| INV-006: Network Enforcement | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Security Invariants FAILED" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ This PR cannot be merged until all violations are resolved." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Reference: [Security Invariants](docs/SECURITY_INVARIANTS.md)" >> $GITHUB_STEP_SUMMARY
          echo "📄 Reference: [ADR-027 Edge Contracts](docs/architecture/ADR-027-edge-contracts.md)" >> $GITHUB_STEP_SUMMARY

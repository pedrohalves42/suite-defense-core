name: Bloco B Lint (DB Anti-Regression)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bloco-b-lint:
    name: 🔒 Bloco B — Definer/Policies/Anon
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Bloco B lint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "## ⚠️ Bloco B Lint SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "DATABASE_URL secret not configured. Invariants NOT validated." >> $GITHUB_STEP_SUMMARY
            echo "::warning::DATABASE_URL not set — Bloco B lint skipped"
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/bloco-b-lint.sql
